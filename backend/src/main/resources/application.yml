spring:
  application:
    name: stockholm
  autoconfigure:
    # 영속성은 프로필별로 DataSource·Flyway·EMF 를 명시 구성함(engine: SqliteConfig, relay: 7단계). 자동 구성은 끔
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.jooq.autoconfigure.JooqAutoConfiguration
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m

server:
  address: 127.0.0.1
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

stockholm:
  data-dir: ${user.home}/Library/Application Support/Stockholm
  http:
    connect-timeout: 5s
    read-timeout: 15s
    user-agent: Stockholm/0.1
  concurrency:
    llm-calls: 4
    collectors: 8

logging:
  level:
    root: info
    banghak.stock: info
