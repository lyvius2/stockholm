server:
  port: 2609

spring:
  jpa:
    open-in-view: false

stockholm:
  db:
    file-name: stockholm.db
    read-pool-size: 4
    placeholders:
      id: TEXT
      decimal: TEXT
      instant: TEXT
      date: TEXT
      bool: INTEGER
      json: TEXT
      text: TEXT
      blob: BLOB

  # 외부 API 기본 주소(키는 Keychain). 테스트는 WireMock 주소로 바꿈
  external:
    openai-base-url: https://api.openai.com/
    anthropic-base-url: https://api.anthropic.com/
    deepseek-base-url: https://api.deepseek.com/
    dart-base-url: https://opendart.fss.or.kr/
    fred-base-url: https://api.stlouisfed.org/
    toss-base-url: https://openapi.tossinvest.com/
    toss-web-socket-url: wss://openapi-ws.tossinvest.com/ws/v1

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        register-health-indicator: false
      # 키 검증기는 5xx·한도 초과를 Unreachable 값으로 돌려주므로 그 값도 실패로 셈
      credential-verify:
        base-config: default
        record-result-predicate: banghak.stock.engine.adapter.out.credential.UnreachableResultPredicate
    instances:
      openai-verify: { base-config: credential-verify }
      anthropic-verify: { base-config: credential-verify }
      deepseek-verify: { base-config: credential-verify }
      ollama-verify: { base-config: credential-verify }
      dart-verify: { base-config: credential-verify }
      fred-verify: { base-config: credential-verify }
      # 토스. 없는 종목(404 → InvalidValueException)은 상대 서버 장애가 아니므로 서킷에 세지 않음
      toss-auth: { base-config: default }
      toss-market-data: { base-config: default, ignore-exceptions: [banghak.stock.core.domain.error.InvalidValueException] }
      toss-chart: { base-config: default, ignore-exceptions: [banghak.stock.core.domain.error.InvalidValueException] }
      toss-market-info: { base-config: default, ignore-exceptions: [banghak.stock.core.domain.error.InvalidValueException] }
      toss-stock: { base-config: default, ignore-exceptions: [banghak.stock.core.domain.error.InvalidValueException] }
      # 주문 거부(400·404·409·422)는 증권사 장애가 아니므로 서킷에 세지 않음
      toss-order: { base-config: default, ignore-exceptions: [banghak.stock.core.domain.error.OrderRejectedException, banghak.stock.core.domain.error.InvalidValueException] }
      toss-order-read: { base-config: default, ignore-exceptions: [banghak.stock.core.domain.error.InvalidValueException] }
      toss-account: { base-config: default, ignore-exceptions: [banghak.stock.core.domain.error.InvalidValueException] }
  # 토스 그룹별 초당 한도(실측 X-RateLimit-Limit). 한도를 넘기면 최대 timeout 만큼 기다린 뒤 실패함
  ratelimiter:
    configs:
      toss:
        limit-refresh-period: 1s
        timeout-duration: 3s
        register-health-indicator: false
    instances:
      toss-market-data: { base-config: toss, limit-for-period: 15 }
      toss-chart: { base-config: toss, limit-for-period: 20 }
      toss-market-info: { base-config: toss, limit-for-period: 3 }
      toss-stock: { base-config: toss, limit-for-period: 5 }
      toss-stock-all: { base-config: toss, limit-for-period: 1 }
      toss-order: { base-config: toss, limit-for-period: 10 }
      toss-order-history: { base-config: toss, limit-for-period: 5 }
      # ORDER_INFO 는 초당 6 이지만 09:00~09:10 에는 3 이라 낮은 쪽으로 둠
      toss-order-info: { base-config: toss, limit-for-period: 3 }
      toss-asset: { base-config: toss, limit-for-period: 5 }
      toss-account: { base-config: toss, limit-for-period: 1 }
