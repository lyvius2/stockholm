# dmg 산출 설정. 서명·공증은 가족 Mac 배포 시점에 정함.
appId: banghak.stock.stockholm
productName: Stockholm
directories:
  buildResources: resources
  output: release
files:
  - out/**
# jlink JRE와 bootJar는 scripts/dist.sh가 resources/daemon/ 에 넣고 아래로 포함함
extraResources:
  - from: resources/daemon
    to: daemon
    filter: ['**/*']
  # 서드파티 라이선스·NOTICE(Apache-2.0 4(d) 재배포 조건). lightweight-charts 는 NOTICE 귀속 문구가 필수
  - from: resources/licenses
    to: licenses
    filter: ['**/*']
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.finance
  hardenedRuntime: false
  # 서명 없음(ad-hoc). 키체인의 개발용 인증서를 자동으로 집어 쓰지 않게 함. 배포 서명은 배포 시점에 결정
  identity: null
